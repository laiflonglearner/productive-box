name: Update productive box

on:
  repository_dispatch:
    types: [build-event]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-productive-box:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update productive box
        uses: ./
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TIMEZONE: ${{ vars.TIMEZONE }}
